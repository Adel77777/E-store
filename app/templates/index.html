<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E Store</title>
</head>
<body>
  <h1>Our Products</h1>
  {% for product in products %}
    <div>
      <img src="{{ product.image }}" width="150">
      <h3>{{ product.name }}</h3>
      <p>{{ product.price }} DA</p>
    </div>
  {% endfor %}
</body>
</html>
