<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
</head>
<body>
    <a class="card" href="{{ url_for('main.product', product_id=product.id) }}">
      <img src="{{ product.image }}" alt="{{ product.name }}" loading="lazy">
      <h3>{{ product.name }}</h3>
      <p class="price">{{ "{:,}".format(product.price) }} DA</p>
    </a>
</body>
</html>
